cat > .github/workflows/ci.yml << 'EOF'
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      DATABASE_URL: "file:./prisma/crm.db"
      JWT_SECRET: "ci-only-secret-not-used-in-production-1234567890"
      NODE_ENV: "test"
      FIREWORKS_MODE: "mock"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx --yes --ignore-scripts prisma@7.8.0 generate

      - name: Type-check
        run: npx --yes --ignore-scripts -p typescript@5.9.3 tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run DB migrations
        run: npx --yes --ignore-scripts prisma@7.8.0 migrate deploy

      - name: Build
        run: npm run build

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
EOF